<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-project</title>
    <!-- Preload fonts to make sure they are loaded before canvas rendering -->
    <link rel="preload" href="/fonts/kantumruy-pro-600.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/kantumruy-pro-700.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <!-- Local font — no Google Fonts network dependency, works on iOS Canvas -->
                <style>
      @font-face {
        font-family: 'KantumruyPro';
        font-weight: 500;
        font-style: normal;
        font-display: block;
        src: url('/fonts/kantumruy-pro-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'KantumruyPro';
        font-weight: 600;
        font-style: normal;
        font-display: block;
        src: url('/fonts/kantumruy-pro-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'KantumruyPro';
        font-weight: 700;
        font-style: normal;
        font-display: block;
        src: url('/fonts/kantumruy-pro-700.woff2') format('woff2');
      }
      /* 800 not available → map to 700 */
      @font-face {
        font-family: 'KantumruyPro';
        font-weight: 800;
        font-style: normal;
        font-display: block;
        src: url('/fonts/kantumruy-pro-700.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
